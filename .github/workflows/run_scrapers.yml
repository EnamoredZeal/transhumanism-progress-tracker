name: Automated Science Scraper

on:
  schedule:
    # This runs the scraper automatically every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # This allows you to manually click a button in GitHub to run it whenever you want

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the code from your repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up a secure Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # 3. Install the dependencies needed for scraping and data processing
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run your python scraper script to check PubMed
    - name: Run Scraper Engine
      run: |
        python scrapers/pubmed_scraper.py

    # 5. Commit any new data changes back to your GitHub repository automatically
    - name: Commit and Push Updates
      run: |
        git config --global user.name "Transhumanist Tracker Bot"
        git config --global user.email "bot@transhuman-tracker.local"
        git add core/database.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Metric Update: $(date +'%Y-%m-%d')" && git push)
